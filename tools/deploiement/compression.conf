# À ajouter dans la configuration nginx du site, à côté de cache.conf (bloc « location / » de l'application).
# Compresse à l'envoi les fichiers 3D (.glb, servis en application/octet-stream), le code et les données : un match
# de finale passe d'environ 40 Mo à environ 25 Mo transférés. Les images (.png, .jpg) le sont déjà : non listées.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/octet-stream model/gltf-binary application/json application/manifest+json application/javascript text/javascript text/css image/svg+xml;

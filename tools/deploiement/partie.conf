# Parties en ligne d'Élite 27 : nginx passe /partie au programme de match, qui n'écoute que sur la machine.
# Installé par tools/deploiement/installer-partie.sh dans /etc/nginx/conf.d/<domaine>.d/.
location /partie {
  proxy_pass http://127.0.0.1:8127;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  # L'adresse du visiteur sert seulement à limiter les essais de code ; elle n'est pas enregistrée.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 90s;
  access_log off;
}

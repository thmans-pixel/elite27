# À ajouter dans la configuration nginx du site (bloc « location / » de l'application).
# Le navigateur garde les fichiers mais vérifie à chaque visite qu'ils n'ont pas changé : après une mise à jour,
# un simple rechargement suffit, et les fichiers 3D inchangés ne sont pas retéléchargés.
add_header Cache-Control "no-cache" always;

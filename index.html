<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Élite 27</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div id="scorebar">
        <div class="side a">
          <span class="chip" id="chipA"></span><span class="name" id="nameA"></span><span class="score" id="scoreA">0</span>
        </div>
        <div class="mid"><span id="clock">2:00</span><span id="period">1re période</span></div>
        <div class="side b">
          <span class="score" id="scoreB">0</span><span class="name" id="nameB"></span><span class="chip" id="chipB"></span>
        </div>
      </div>
      <div id="pens"><div id="pensA"></div><div id="pensB"></div></div>
      <div id="adv" hidden></div>
      <div id="goal" hidden></div>
      <div id="call" hidden></div>
      <div id="who"></div>
      <div id="help"></div>
      <div id="pause" hidden><div>Pause</div><small>Échap ou Start pour reprendre</small><button id="pauseControls" class="ghost">Commandes</button></div>
    </div>

    <div id="menu">
      <div class="card">
        <h1>ÉLITE <span>27</span></h1>
        <p class="tag">Roller hockey · Ligue Élite 2026-2027</p>
        <div class="fixture">
          <div><b id="fixHome"></b><small>domicile</small></div>
          <i>—</i>
          <div><b id="fixAway"></b><small>extérieur</small></div>
        </div>
        <p class="venue" id="venue"></p>
        <div class="opt teams">
          <label for="equipe">Ton équipe</label>
          <select id="equipe"></select>
        </div>
        <div class="opt teams">
          <label for="adversaire">Adversaire</label>
          <select id="adversaire"></select>
        </div>
        <div class="opt" data-opt="lieu">
          <label>Tu joues</label>
          <button data-v="domicile" class="on">À domicile</button><button data-v="exterieur">À l'extérieur</button>
        </div>
        <div class="opt" data-opt="humans">
          <label>Joueurs</label>
          <button data-v="1" class="on">1 joueur</button><button data-v="2">2 joueurs</button><button data-v="0">Démonstration</button>
        </div>
        <div class="opt" data-opt="difficulty">
          <label>Difficulté</label>
          <button data-v="facile">Facile</button><button data-v="normal" class="on">Normal</button><button data-v="difficile">Difficile</button>
        </div>
        <div class="opt" data-opt="period">
          <label>Durée</label>
          <button data-v="120" class="on">2 × 2 min</button><button data-v="300">2 × 5 min</button><button data-v="600">2 × 10 min</button><button data-v="1500">2 × 25 min</button>
        </div>
        <div class="opt" data-opt="tie">
          <label>Égalité</label>
          <button data-v="prolongation" class="on">Prolongation et tirs</button><button data-v="nul">Match nul</button>
        </div>
        <div class="opt" data-opt="switch">
          <label>Patineur</label>
          <button data-v="auto" class="on">Changement automatique</button><button data-v="manuel">Manuel (touche R)</button>
        </div>
        <div class="opt" data-opt="lines">
          <label>Lignes</label>
          <button data-v="auto" class="on">Changement automatique</button><button data-v="manuel">Manuel (touche A)</button>
        </div>
        <div class="opt" data-opt="players">
          <label>Joueurs</label>
          <button data-v="modele" class="on">Modèle 3D</button><button data-v="simple">Simplifiés</button>
        </div>
        <div class="opt" data-opt="sound">
          <label>Son</label>
          <button data-v="oui" class="on">Activé</button><button data-v="non">Coupé</button>
        </div>
        <p class="keys" id="padInfo"></p>
        <p id="menuError" hidden></p>
        <button id="play">Jouer <kbd>Entrée</kbd></button><button id="seasonBtn" class="ghost">Saison</button><button id="controlsBtn" class="ghost">Commandes</button>
        <p class="keys" id="seasonHint"></p>
        <p class="keys">Toutes les touches, au clavier et à la manette, sont dans « Commandes ».</p>
      </div>
    </div>

    <div id="controls" hidden>
      <div class="card wide">
        <p class="tag">Guide</p>
        <h2>Commandes</h2>
        <div id="controlsTabs" class="opt"><button data-v="pad">Manette</button><button data-v="k1">Clavier joueur 1</button><button data-v="k2">Clavier joueur 2</button></div>
        <div id="controlsBody"></div>
        <div id="seasonActions"><button id="controlsClose">Fermer</button></div>
      </div>
    </div>

    <div id="season" hidden>
      <div class="card wide">
        <p class="tag" id="seasonTag">Saison 2026-2027 · phase de qualification</p>
        <h2 id="seasonTitle"></h2>
        <div id="seasonBody"></div>
        <p id="seasonWait" hidden>Simulation des matchs…</p>
        <div id="seasonActions">
          <button id="seasonPlay">Jouer le match</button><button id="seasonSim" class="ghost">Simuler la journée</button>
          <button id="seasonMenu" class="ghost">Menu</button><button id="seasonDrop" class="ghost">Abandonner la saison</button>
        </div>
      </div>
    </div>

    <div id="final" hidden>
      <div class="card">
        <h2>Fin du match</h2>
        <div id="finalBody"></div>
        <button id="again">Rejouer <kbd>Entrée</kbd></button><button id="back" class="ghost">Menu</button>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
